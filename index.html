<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Log & Traffic Analyzer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 49, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #e2e8f0;
            --accent-cyan: #00f2fe;
            --accent-red: #ff4b2b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Glassmorphism Card Style */
        .custom-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-cyan) !important;
        }

        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-zone:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.05);
        }

        .btn-cyber {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: #000;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        .btn-cyber:hover {
            transform: translateY(-2px);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }

        .alert-cyber-danger {
            background: rgba(255, 75, 43, 0.15);
            border: 1px solid rgba(255, 75, 43, 0.4);
            color: #ff6b6b;
            border-radius: 8px;
        }

        .alert-cyber-success {
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: var(--accent-cyan);
            border-radius: 8px;
        }

        .table-dark-custom {
            color: var(--text-color);
            background: transparent;
        }

        .table-dark-custom th {
            border-color: var(--border-color);
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .table-dark-custom td {
            border-color: var(--border-color);
        }
    </style>
</head>
<body class="pb-5">

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-card my-3 container">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-shield-halved me-2"></i>LOG ANALYZER</a>
            <span class="badge bg-outline-info border text-info px-3 py-2"><i class="fa-solid fa-circle-dot me-1 text-success"></i> System Ready</span>
        </div>
    </nav>

    <div class="container mt-4">
        
        <!-- Upload Section -->
        <div class="row">
            <div class="col-12">
                <div class="custom-card p-4">
                    <h5 class="mb-3"><i class="fa-solid fa-file-arrow-up me-2 text-info"></i>Upload Server Access Log</h5>
                    <form id="uploadForm" class="row g-3 align-items-center">
                        <div class="col-md-9">
                            <div class="upload-zone" onclick="document.getElementById('logFile').click();">
                                <i class="fa-solid fa-cloud-arrow-up fa-2x mb-2 text-info"></i>
                                <p class="mb-0 text-muted" id="fileNameDisplay">Click to browse or drag and drop server access log file here</p>
                                <input type="file" id="logFile" class="d-none" accept=".log,.txt" onchange="updateFileName(this)">
                            </div>
                        </div>
                        <div class="col-md-3 text-center">
                            <button type="submit" class="btn btn-cyber w-100 py-3"><i class="fa-solid fa-bolt me-2"></i>Analyze Log</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Security Threat Alerts Section -->
        <div class="row mt-4" id="alertsSection" style="display: none;">
            <div class="col-12">
                <div class="custom-card p-4">
                    <h5 class="mb-3"><i class="fa-solid fa-triangle-exclamation me-2 text-warning"></i>Security Threat Detection</h5>
                    <div id="alertsContainer"></div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="row mt-4" id="chartsSection" style="display: none;">
            <!-- Status Code Distribution -->
            <div class="col-md-6 mb-4">
                <div class="custom-card p-4 h-100">
                    <h6 class="text-muted mb-3"><i class="fa-solid fa-chart-pie me-2 text-info"></i>HTTP Status Code Distribution</h6>
                    <div style="max-height: 300px; position: relative;">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
            <!-- Top IPs Chart -->
            <div class="col-md-6 mb-4">
                <div class="custom-card p-4 h-100">
                    <h6 class="text-muted mb-3"><i class="fa-solid fa-chart-simple me-2 text-info"></i>Top Requesting IP Addresses</h6>
                    <div style="max-height: 300px; position: relative;">
                        <canvas id="ipChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let statusChartInstance = null;
        let ipChartInstance = null;

        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                display.innerText = `Selected File: ${input.files[0].name}`;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('logFile');
            if (!fileInput.files[0]) {
                alert('Please select a log file first!');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('http://127.0.0.1:8000/api/analyze', {
    method: 'POST',
    body: formData
});

                if (!response.ok) {
                    throw new Error('Failed to analyze log file.');
                }

                const data = await response.json();
                renderResults(data);

            } catch (error) {
                alert(error.message);
            }
        });

        function renderResults(data) {
            document.getElementById('alertsSection').style.display = 'block';
            document.getElementById('chartsSection').style.display = 'block';

            // Security Alerts Handling
            const alertsContainer = document.getElementById('alertsContainer');
            alertsContainer.innerHTML = '';

            if (data.brute_force_alerts && data.brute_force_alerts.length > 0) {
                data.brute_force_alerts.forEach(alertMsg => {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-cyber-danger p-3 mb-2 d-flex align-items-center';
                    alertDiv.innerHTML = `<i class="fa-solid fa-shield-virus fa-lg me-3"></i><div>${alertMsg}</div>`;
                    alertsContainer.appendChild(alertDiv);
                });
            } else {
                alertsContainer.innerHTML = `
                    <div class="alert alert-cyber-success p-3 mb-0 d-flex align-items-center">
                        <i class="fa-solid fa-circle-check fa-lg me-3"></i>
                        <div>No suspicious brute-force activity detected in this log.</div>
                    </div>`;
            }

            // Render Status Chart
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            if (statusChartInstance) statusChartInstance.destroy();
            
            statusChartInstance = new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(data.status_code_counts),
                    datasets: [{
                        data: Object.values(data.status_code_counts),
                        backgroundColor: ['#00f2fe', '#ff4b2b', '#ffb300', '#00e676', '#7c4dff']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#e2e8f0' } }
                    }
                }
            });

            // Render Top IPs Chart
            const ipCtx = document.getElementById('ipChart').getContext('2d');
            if (ipChartInstance) ipChartInstance.destroy();

            ipChartInstance = new Chart(ipCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(data.top_ip_addresses),
                    datasets: [{
                        label: 'Requests',
                        data: Object.values(data.top_ip_addresses),
                        backgroundColor: '#00f2fe'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#e2e8f0' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#e2e8f0' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    },
                    plugins: {
                        legend: { labels: { color: '#e2e8f0' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
